<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gooder 團購</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--paper:#f4e6c8;--card:#fbf4e3;--sunk:#ecdbb5;--ink:#1c2d4a;--muted:#6b6250;--line:#dcc79e;--accent:#c0392b;--mustard:#e8b84a;--navy:#1c2d4a;--navy-ink:#f4e6c8;--ok:#3f7a52;
  --serif:"Noto Serif TC","Songti TC",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;border-bottom:3px solid var(--accent)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.08em}
.brand svg{width:28px;height:28px}
.badge{background:var(--navy);color:var(--navy-ink);font-size:11px;font-weight:700;letter-spacing:.14em;padding:5px 9px}
h1{font-family:var(--serif);font-weight:900;font-size:26px;margin:16px 0 2px;line-height:1.3}
h2{font-family:var(--serif);font-weight:900;font-size:19px;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.sub{color:var(--muted);font-size:14px}
.notice{margin-top:12px;border-radius:6px;padding:10px 14px;font-size:14px;background:var(--sunk)}
.notice.err{color:var(--accent);font-weight:700}
.prog{margin-top:14px;background:var(--navy);color:var(--navy-ink);border-radius:6px;padding:14px;border-bottom:4px solid var(--mustard)}
.prog .bar{height:10px;background:rgba(244,230,200,.2);border-radius:999px;overflow:hidden;margin:8px 0 6px}
.prog .bar i{display:block;height:100%;background:var(--mustard)}
.prog b{font-family:var(--serif);font-size:22px;color:var(--mustard)}
.box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 14px}
.prod{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.prod .i{flex:1;min-width:0}
.prod .n{font-family:var(--serif);font-weight:900;font-size:18px}
.prod .t{font-size:12px;color:var(--accent);font-weight:700}
.prod .p{font-size:13px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;cursor:pointer}
.qty output{min-width:2ch;text-align:center;font-family:var(--serif);font-size:20px;font-weight:900}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--ink);border-color:var(--ink)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.btn{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 16px;border-radius:12px;min-height:48px;cursor:pointer}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);font-weight:700}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.btn.block{width:100%}.btn.ghost{background:transparent}.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sum{margin-top:12px;background:var(--sunk);border-radius:6px;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline}
.sum b{font-family:var(--serif);font-size:24px;color:var(--accent)}
.mine{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mustard);border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--navy);color:var(--navy-ink);font-size:12px}
td:first-child,th:first-child{text-align:left}
tfoot td{font-weight:700;background:var(--sunk)}
tr.paid td{color:var(--muted)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);padding:0}
.tab{display:flex;gap:6px;margin-bottom:10px}
.tab button{flex:1;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
.tab button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);font-weight:700}
.copy{width:100%;min-height:150px;font-size:14px;background:var(--sunk)}
.muted{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:999px;font-size:14px;z-index:9}
.done{margin-top:16px;background:var(--card);border:2px solid var(--ok);border-radius:8px;padding:16px 14px}
.done .ok{font-family:var(--serif);font-weight:900;font-size:24px;color:var(--ok)}
.done .who{font-weight:700;font-size:18px;margin:6px 0 4px}
.done .ln{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.done .tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px}
.done .tot b{font-family:var(--serif);font-size:26px;color:var(--accent)}
.lead{background:#fff8e6;border:2px solid var(--mustard);border-radius:8px;padding:4px 14px 14px;margin-top:16px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><svg viewBox="0 0 32 32" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M16 4 L29 27 L3 27 Z"/><path d="M6.5 22 L25.5 22"/><circle cx="13" cy="17" r="1.8"/><circle cx="19" cy="18" r="1.8"/></svg>GOODER</div>
    <div class="badge">FROZEN PIZZA</div>
  </header>
  <div id="main"><p class="sub" style="margin-top:30px;text-align:center">載入團購資料中…</p></div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const _p=new URLSearchParams(location.search),_t=v=>String(v||"").replace(/[^A-Za-z0-9]/g,"").slice(0,40);
const BOOT={token:_t(_p.get("g")),key:_t(_p.get("k"))};
// LINE 名單解析器（瀏覽器與 node 共用）
function parseLineOrders(text, products){
  const ALIAS={"莓醋煙鴨":["莓醋煙鴨","莓醋燻鴨","煙燻鴨","煙鴨","燻鴨","莓醋","鴨肉"],"瑪格麗特":["瑪格麗特","瑪格莉特","瑪格麗","瑪格","番茄"],
    "辣味培根":["辣味培根","辣培根","培根","辣味"],"原味起司":["原味起司","原味起士","起司","起士","芝士","乳酪","原味"]};
  // 單字簡稱（鴨、瑪、培、原）只在後面或前面有數量時才算，避免跟人名撞字
  const SHORT1={"莓醋煙鴨":"鴨","瑪格麗特":"瑪","辣味培根":"培","原味起司":"原"};
  const pid={};for(const p of products)pid[p.name]=p.id;
  const esc=a=>a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const pairs=[];for(const[n,al]of Object.entries(ALIAS))if(pid[n])for(const a of al)pairs.push([a,pid[n]]);
  for(const p of products)if(!ALIAS[p.name])pairs.push([p.name,p.id]);
  pairs.sort((a,b)=>b[0].length-a[0].length);
  const singles=[];
  for(const p of products){const sc=(p.short||SHORT1[p.name]||"").trim();if(!sc)continue;if(sc.length===1)singles.push([sc,p.id]);else pairs.push([sc,p.id])}
  pairs.sort((a,b)=>b[0].length-a[0].length);
  const alt=pairs.map(([a])=>esc(a)).join("|"), alt1=singles.map(([c])=>esc(c)).join("|");
  const unit="(?:顆|個|片|份|盒|入)?", sep="[xX×*＊:：=＝+＋]?";
  const re=new RegExp(`(\\d+)\\s*${unit}\\s*(${alt})|(${alt})\\s*${sep}\\s*(\\d+)\\s*${unit}|(${alt})`+(alt1?`|(${alt1})\\s*${sep}\\s*(\\d+)\\s*${unit}|(\\d+)\\s*${unit}\\s*(${alt1})(?![\\u4e00-\\u9fff])`:""),"g");
  const idOf=a=>{const p=pairs.find(x=>x[0]===a);if(p)return p[1];const s=singles.find(x=>x[0]===a);return s&&s[1]};
  const norm=s=>s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g," ");
  const NOISE=/^(留言\s*\d*|回應|說些什麼吧|已讀\s*\d*|查看更多.*|顯示.*則留言|讚|回覆)$/;
  const out=[],skipped=[];let cur=null,excl=[];
  const push=name=>{let m=out.find(x=>x.name===name);if(!m){m={name,phone:"",address:"",q:{}};out.push(m)}return m};
  const allIds=Object.values(pid);
  for(const raw of norm(text).split(/\r?\n/)){
    let line=raw.replace(/(上午|下午)?\s*\d{1,2}[:：]\d{2}/g," ").replace(/\d+\s*(秒|分鐘|分|小時|天|週|周|個月|年)前/g," ")
      .replace(/[・·•]\s*貼文者/g," ").replace(/已讀\s*\d*/g," ").trim();
    if(!line||NOISE.test(line))continue;
    line=line.replace(/^[#＃]?\s*\d{1,3}\s*[.．、)）:：\-]\s*/,"").trim();
    if(!line)continue;
    // 「培根除外」「不要培根」：記下要排除的口味
    const exRe=new RegExp(`(${alt}${alt1?"|"+alt1:""})\\s*(?:除外|以外)|(?:不要|不含|不用)\\s*(${alt}${alt1?"|"+alt1:""})`,"g");
    if(/除外|以外|不要|不含|不用/.test(line))for(const h of line.matchAll(exRe))excl.push(idOf(h[1]||h[2]));
    if(/除外|以外|不要|不含|不用/.test(line)&&!/\d/.test(line)){
      if(!cur)skipped.push(raw.trim());continue}
    // 「其他口味各2個」「全部各1」「每種1個」
    const each=line.match(/(?:各|每種|每樣|每個口味|全部|都)\s*(?:口味)?\s*(\d+)/);
    if(each&&cur){const n=+each[1];for(const id of allIds)if(!excl.includes(id))cur.q[id]=(cur.q[id]||0)+n;excl=[];continue}
    const hits=[...line.matchAll(re)];
    if(!hits.length){
      const name=line.replace(/[：:，,、\-\s]+$/,"").trim();
      if(name&&name.length<=24&&!/接龍|團購|截止|日期|合計|總共|謝謝|感謝|開團|收回|訊息|相簿|記事本/.test(name)){cur=push(name);excl=[]}
      else skipped.push(raw.trim());
      continue}
    let name=line.slice(0,hits[0].index).replace(/[：:，,、;；\-\s]+$/,"").replace(/^[：:\s]+/,"").trim();
    const target=name?push(name):cur;
    if(!target){skipped.push(raw.trim());continue}
    if(name){cur=target;excl=[]}
    for(const h of hits){
      const a=h[2]||h[3]||h[5]||h[6]||h[9];
      const n=h[1]?+h[1]:h[4]?+h[4]:h[7]?+h[7]:h[8]?+h[8]:1;
      const id=idOf(a);if(id)target.q[id]=(target.q[id]||0)+n}
  }
  return{members:out.filter(m=>Object.values(m.q).some(v=>v>0)),skipped};
}


const TAG={"莓醋煙鴨":"莓果微酸，襯出煙鴨香","瑪格麗特":"經典義式風味，簡單耐吃","辣味培根":"微辣香氣，搭配培根鹹香","原味起司":"濃郁起司，回歸原味"};
const SHORT={"莓醋煙鴨":"鴨","瑪格麗特":"瑪","辣味培根":"培","原味起司":"原"};
const sc=p=>p.short||SHORT[p.name]||p.name;const tg=p=>p.tagline||TAG[p.name]||"";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nt=n=>"$"+Math.round(n||0).toLocaleString("zh-TW");
const GOODER_API="https://script.google.com/macros/s/AKfycbyH47yHfZCfoonsQLq2pUik8FWlmZjCV9lXZVAmCzXS3jtEIh1q-rW3WT63vGe2Mgdqbg/exec";
const run=(fn,...a)=>fetch(GOODER_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args:a})})
  .then(r=>{if(!r.ok)throw new Error("NET");return r.json()}).then(o=>{if(!o.ok)throw new Error(o.err);return o.data});
const MK="gooderMine_"+BOOT.token;
let D=null,mine=[],form={id:null,editKey:"",name:"",q:{}},leadTab="link",confirmAct=null,busy=false,sent=null,adding=false;
try{mine=JSON.parse(localStorage.getItem(MK)||"[]")}catch(_){}
const saveMine=()=>{try{localStorage.setItem(MK,JSON.stringify(mine))}catch(_){}};
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2000)}
function errText(e){const m=String(e&&e.message||e);
  if(m.includes("CLOSED"))return"這團已經結單，如需更改請直接找團主。";if(m.includes("NO_GROUP"))return"找不到這個團購，請跟團主確認連結。";
  if(m.includes("NO_NAME"))return"請填你的名字。";if(m.includes("NO_QTY"))return"請至少選一顆。";if(m.includes("NO_PERM"))return"無法修改這筆訂單，請直接找團主。";
  if(m.includes("EMPTY"))return"還沒有人登記，不能結單。";if(m.includes("CANCELLED"))return"這團已取消。";return"連線失敗，請再試一次。"}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("已複製")}catch(_){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("已複製")}catch(__){toast("請長按選取後複製")}a.remove()}}
const totalQ=()=>{const t={};let n=0;for(const e of D.entries)for(const[k,v]of Object.entries(e.q||{})){t[k]=(t[k]||0)+v;n+=v}return{t,n}};
const isGroupPrice=n=>n>=D.groupMin;
const unit=(p,n)=>isGroupPrice(n)?p.group:p.retail;
const amt=(q,n)=>D.products.reduce((a,p)=>a+(q[p.id]||0)*unit(p,n),0);
const qn=q=>Object.values(q||{}).reduce((a,b)=>a+(b||0),0);
const itemsTxt=q=>D.products.filter(p=>(q||{})[p.id]>0).map(p=>sc(p)+(q[p.id])).join(" ");
const buyerUrl=()=>location.origin+location.pathname+"?g="+BOOT.token;
const lineMsg=()=>`點連結下訂單：\n${buyerUrl()}`;
const chainTpl=()=>`接龍格式（複製後改成自己的名字和數量）：\n名字 ${D.products.map(p=>sc(p)+"0").join(" ")}\n（${D.products.map(p=>`${sc(p)}＝${p.name}`).join("、")}）`;
function dunMsg(){const{n}=totalQ(),un=D.entries.filter(e=>!e.paid);
  return `【${D.group.title}】付款提醒\n還有 ${un.length} 位尚未付款：\n`+un.map(e=>`・${e.name}　${qn(e.q)} 顆 ${nt(amt(e.q,n))}`).join("\n")+`\n——\n未收合計 ${nt(un.reduce((a,e)=>a+amt(e.q,n),0))}${isGroupPrice(n)?"":`\n（目前以零售價計算，全團滿 ${D.groupMin} 顆會改用團購價）`}\n已經付款的請忽略，謝謝！`}
function statement(){const{t,n}=totalQ();
  return `【${D.group.title}】對帳單（共 ${n} 顆，${isGroupPrice(n)?"團購價":"零售價"}）\n`+D.entries.map((e,i)=>`${i+1}. ${e.name}：${itemsTxt(e.q)}　${qn(e.q)} 顆 ${nt(amt(e.q,n))}${e.paid?"（已付）":""}`).join("\n")+
  `\n——\n${D.products.filter(p=>t[p.id]).map(p=>`${p.name} ${t[p.id]}`).join("、")}\n合計 ${nt(D.entries.reduce((a,e)=>a+amt(e.q,n),0))}`}
async function load(){try{D=JSON.parse(await run("pubLoad",BOOT.token,BOOT.key));render()}catch(e){$("main").innerHTML=`<div class="notice err">${esc(errText(e))}</div>`}}

function render(){
  if(D.group.status==="cancel"){$("main").innerHTML=`<h1>${esc(D.group.title)}</h1><div class="notice err" style="margin-top:16px">這團已取消，不能再下單。如有疑問，請直接找團主。</div>`;return}
  const g=D.group,open=g.status==="open",{t,n}=totalQ(),need=Math.max(0,D.groupMin-n),pct=Math.min(100,Math.round(n/D.groupMin*100));
  const myIds=new Set(mine.map(m=>m.id));const myEntries=D.entries.filter(e=>myIds.has(e.id)).map(e=>({...e,name:e.name||(mine.find(m=>m.id===e.id)||{}).name||"我"}));
  const f=form,fn=qn(f.q),projected=n-(f.id?qn((D.entries.find(e=>e.id===f.id)||{}).q):0)+fn;
  let h=`<h1>${esc(g.title)}</h1><div class="sub" style="color:var(--accent);font-weight:700">${esc(D.sizeText)}｜全程冷凍宅配</div><div class="sub">團主：${esc(g.leader)}${g.deadline?`　收單至 ${esc(g.deadline)}`:""}${open?"":"　<b style='color:var(--accent)'>已結單</b>"}</div>
  <div class="prog"><div style="display:flex;justify-content:space-between;align-items:baseline"><span>全團目前</span><span><b>${n}</b> / ${D.groupMin} 顆</span></div>
   <div class="bar"><i style="width:${pct}%"></i></div><div style="font-size:14px">${isGroupPrice(n)?"已達標！全團每顆都用團購價":`再 ${need} 顆，全團每顆都用團購價`}</div></div>`;
  if(D.isLeader)h+=leaderHTML(t,n);
  const sentE=sent&&myEntries.find(e=>e.id===sent);
  const showForm=open&&!sentE&&(f.id||adding||!myEntries.length);
  if(sentE){const sa=amt(sentE.q,n);
    h+=`<div class="done"><div class="ok">✓ 訂單已送出</div><div class="who">${esc(sentE.name)}</div>
      ${D.products.filter(p=>(sentE.q||{})[p.id]>0).map(p=>`<div class="ln"><span>${esc(p.name)} × ${sentE.q[p.id]}</span><span>${nt(sentE.q[p.id]*unit(p,n))}</span></div>`).join("")}
      <div class="tot"><span>共 ${qn(sentE.q)} 顆・${isGroupPrice(n)?"團購價":"目前零售價"}</span><b>${nt(sa)}</b></div>
      ${isGroupPrice(n)?"":`<div class="muted" style="margin-top:6px">全團滿 ${D.groupMin} 顆後會自動改用團購價，金額以團主結單時為準。</div>`}
      <div class="muted" style="margin-top:6px">可以截圖這個畫面傳給團主，方便對帳。付款方式請看團主的說明。</div>
      <div style="height:12px"></div>${open?`<div class="row"><button class="btn" style="flex:1" type="button" data-act="edit" data-id="${sentE.id}">修改這筆</button><button class="btn" style="flex:1" type="button" data-act="another">再幫一位登記</button></div><div style="height:8px"></div>`:""}
      <button class="btn primary block" type="button" data-act="sentok">好，知道了</button></div>`;
  }
  if(showForm){
    h+=`<h2>${f.id?"修改我的訂單":"我要訂"}</h2><div class="box">${D.products.map(p=>`<div class="prod"><div class="i"><div class="n">${esc(p.name)}</div>${tg(p)?`<div class="t">${esc(tg(p))}</div>`:""}<div class="p">零售 $${p.retail}・團購 $${p.group}</div></div>
      <div class="qty"><button type="button" data-q="${p.id}" data-d="-1" aria-label="${esc(p.name)}減一">−</button><output>${f.q[p.id]||0}</output><button type="button" data-q="${p.id}" data-d="1" aria-label="${esc(p.name)}加一">+</button></div></div>`).join("")}</div>
     <div style="height:10px"></div><label>你的名字（團主認得的稱呼）<input id="fname" value="${esc(f.name)}" autocomplete="off"></label>
     <div class="sum"><span>${fn} 顆・${isGroupPrice(projected)?"團購價":"目前零售價"}</span><b>${nt(D.products.reduce((a,p)=>a+(f.q[p.id]||0)*unit(p,projected),0))}</b></div>
     ${!isGroupPrice(projected)&&fn?`<div class="muted" style="margin-top:6px">${esc(D.shipNote)}全團滿 ${D.groupMin} 顆後，會自動改用團購價，金額以團主結單時為準。</div>`:""}
     <div style="height:10px"></div><div class="row"><button class="btn accent" style="flex:1" type="button" data-act="submit" ${busy?"disabled":""}>${f.id?"儲存修改":"送出訂單"}</button>${f.id||(adding&&myEntries.length)?`<button class="btn ghost" type="button" data-act="cancelEdit">取消</button>`:""}</div>`;
  }
  if(myEntries.length){h+=`<h2>我的訂單</h2><p class="muted" style="margin:-4px 0 10px">${open?(showForm||sentE?"":"這支手機已經登記過了。要改數量請按「修改」，不用重新填一張。")+"結單前都可以修改或取消。":"已結單，不能再修改。"}如果無法更改（例如換了手機），請直接找團主。</p>`+myEntries.map(e=>`<div class="mine"><div><b>${esc(e.name)}</b><div class="muted">${esc(itemsTxt(e.q))}・${qn(e.q)} 顆・${nt(amt(e.q,n))}</div></div>
    ${open?`<div class="row"><button class="btn sm" type="button" data-act="edit" data-id="${e.id}">修改</button>${confirmAct==="del:"+e.id?`<button class="btn sm accent" type="button" data-act="delyes" data-id="${e.id}">確定刪除</button>`:`<button class="btn sm ghost" type="button" data-act="del" data-id="${e.id}">刪除</button>`}</div>`:""}</div>`).join("");
    if(open&&!showForm&&!sentE)h+=`<button class="btn block ghost" type="button" data-act="another">再幫一位家人／朋友登記</button>`}
  if(!D.isLeader)h+=`<p class="muted" style="margin-top:16px;text-align:center">目前 ${D.entries.length} 人登記・共 ${n} 顆</p>`;
  $("main").innerHTML=h;
}
function leaderHTML(t,n){
  const open=D.group.status==="open",paidAmt=D.entries.filter(e=>e.paid).reduce((a,e)=>a+amt(e.q,n),0),all=D.entries.reduce((a,e)=>a+amt(e.q,n),0);
  let h=`<div class="lead"><h2 style="margin-top:12px">團主專區</h2>`;
  if(open){h+=`<p class="muted" style="margin-top:0">選一種方式收單，兩種可以同時用：</p>
    <div class="tab"><button type="button" data-tab="link" aria-pressed="${leadTab==="link"}">填單連結</button><button type="button" data-tab="chain" aria-pressed="${leadTab==="chain"}">LINE 接龍</button></div>
    ${leadTab==="link"?`<p class="muted" style="margin:0 0 8px">複製連結貼到群組，前後想說什麼自己寫就好。大家點開就能選口味下單，不用登入，也看不到別人的名字。</p><textarea class="copy" readonly style="min-height:90px">${esc(lineMsg())}</textarea><div style="height:8px"></div><button class="btn primary block" type="button" data-act="copyMsg">複製連結</button>`
    :`<p class="muted" style="margin:0 0 8px">把接龍格式放進你的團購文裡。大家接完後，整段複製貼到下面的框，按「帶入名單」就統計好了。</p><textarea class="copy" readonly style="min-height:90px">${esc(chainTpl())}</textarea><div style="height:8px"></div><button class="btn primary block" type="button" data-act="copyChain">複製接龍格式</button>
      <div style="height:12px"></div><label>貼上接龍結果<textarea id="chainIn" rows="6" placeholder="把 LINE 群組裡的接龍整段貼在這裡"></textarea></label><div style="height:8px"></div><button class="btn accent block" type="button" data-act="import">帶入名單</button><div id="impMsg" class="muted" style="margin-top:6px;white-space:pre-line"></div>`}`}
  h+=`<h2>收單統計（${D.entries.length} 人・${n} 顆）</h2>`+(D.entries.length?`<div class="tbl"><table><thead><tr><th>名字</th>${D.products.map(p=>`<th>${esc(sc(p))}</th>`).join("")}<th>顆</th><th>金額</th><th>已付</th>${open?"<th></th>":""}</tr></thead>
   <tbody>${D.entries.map(e=>`<tr class="${e.paid?"paid":""}"><td>${esc(e.name)}</td>${D.products.map(p=>`<td>${(e.q||{})[p.id]||"·"}</td>`).join("")}<td>${qn(e.q)}</td><td>${nt(amt(e.q,n))}</td>
    <td><input type="checkbox" data-paid="${e.id}" ${e.paid?"checked":""} aria-label="${esc(e.name)} 已付款"></td>${open?`<td>${confirmAct==="ldel:"+e.id?`<button class="btn sm accent" type="button" data-act="ldelyes" data-id="${e.id}">刪</button>`:`<button class="btn sm ghost" type="button" data-act="ldel" data-id="${e.id}" aria-label="刪除 ${esc(e.name)}">✕</button>`}</td>`:""}</tr>`).join("")}</tbody>
   <tfoot><tr><td>合計</td>${D.products.map(p=>`<td>${t[p.id]||0}</td>`).join("")}<td>${n}</td><td>${nt(all)}</td><td colspan="${open?2:1}"></td></tr></tfoot></table></div>
   <div class="sum"><span>已收 ${nt(paidAmt)}</span><span>未收 <b>${nt(all-paidAmt)}</b></span></div>
   <div style="height:8px"></div>${D.entries.some(e=>!e.paid)?`<button class="btn accent block" type="button" data-act="copyDun">複製催款訊息（還有 ${D.entries.filter(e=>!e.paid).length} 位未付）</button><div style="height:8px"></div>`:`<div class="notice" style="margin:0 0 8px;color:var(--ok);font-weight:700">全部都付款了 ✓</div>`}
   <button class="btn block" type="button" data-act="copyStmt">複製對帳單（收錢、對數量用）</button>`:`<p class="muted">還沒有人登記。</p>`);
  if(open)h+=`<div style="height:14px"></div>${confirmAct==="close"?`<div class="notice"><b>確定結單？</b>結單後大家就不能再填或修改，訂單會送到店家。<div style="height:8px"></div><div class="row"><button class="btn accent" style="flex:1" type="button" data-act="closeyes">確定結單</button><button class="btn ghost" type="button" data-act="closeno">再等等</button></div></div>`
    :`<button class="btn accent block" type="button" data-act="close" ${D.entries.length?"":"disabled"}>結單，送出給店家</button>`}`;
  else h+=`<div class="notice" style="margin-top:12px">已結單並送到店家，店家會照這份名單出貨。</div>`;
  return h+`</div>`;
}
document.addEventListener("click",async ev=>{
  const q=ev.target.closest("[data-q]");if(q){form.q[q.dataset.q]=Math.max(0,(form.q[q.dataset.q]||0)+Number(q.dataset.d));const nm=$("fname");if(nm)form.name=nm.value;render();return}
  const tb=ev.target.closest("[data-tab]");if(tb){leadTab=tb.dataset.tab;render();return}
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  const nm=$("fname");if(nm)form.name=nm.value;
  try{
    if(a==="submit"){form.name=($("fname")?.value||"").trim();if(!form.name){toast("請填你的名字");$("fname").focus();return}if(!qn(form.q)){toast("請至少選一顆");return}
      busy=true;render();
      const r=JSON.parse(await run("pubSave",BOOT.token,BOOT.key,JSON.stringify({id:form.id,editKey:form.editKey,name:form.name,q:form.q})));
      if(!form.id)mine.push({id:r.id,editKey:r.editKey,name:form.name});else{const m=mine.find(x=>x.id===form.id);if(m)m.name=form.name}saveMine();
      toast(form.id?"已更新":"已送出，謝謝！");sent=form.id||r.id;adding=false;form={id:null,editKey:"",name:"",q:{}};busy=false;await load();window.scrollTo(0,0);return}
    if(a==="sentok"){sent=null;render();return}
    if(a==="cancelEdit"){adding=false;form={id:null,editKey:"",name:"",q:{}};render();return}
    if(a==="another"){sent=null;adding=true;form={id:null,editKey:"",name:"",q:{}};render();document.querySelector(".box")?.scrollIntoView({block:"center"});return}
    if(a==="edit"){const e=D.entries.find(x=>x.id===id),m=mine.find(x=>x.id===id);sent=null;form={id,editKey:m?.editKey||"",name:e.name||m?.name||"",q:{...e.q}};render();document.querySelector(".box")?.scrollIntoView({block:"center"});return}
    if(a==="del"||a==="ldel"){confirmAct=(a==="del"?"del:":"ldel:")+id;render();return}
    if(a==="delyes"||a==="ldelyes"){const m=mine.find(x=>x.id===id);await run("pubDelete",BOOT.token,BOOT.key,id,m?.editKey||"");mine=mine.filter(x=>x.id!==id);saveMine();confirmAct=null;toast("已刪除");await load();return}
    if(a==="copyMsg")return copy(lineMsg());
    if(a==="copyChain")return copy(chainTpl());
    if(a==="copyStmt")return copy(statement());
    if(a==="copyDun")return copy(dunMsg());
    if(a==="import"){const r=parseLineOrders($("chainIn").value,D.products);
      if(!r.members.length){$("impMsg").textContent="看不出口味和數量，請確認貼的是接龍內容。";return}
      const k=await run("pubImport",BOOT.token,BOOT.key,JSON.stringify(r.members.map(m=>({name:m.name,q:m.q}))));
      toast(`已帶入 ${k} 位`);await load();const im=$("impMsg");if(im&&r.skipped.length)im.textContent="略過的行：\n"+r.skipped.slice(0,6).join("\n");return}
    if(a==="close"){confirmAct="close";render();return}
    if(a==="closeno"){confirmAct=null;render();return}
    if(a==="closeyes"){b.disabled=true;await run("pubClose",BOOT.token,BOOT.key);confirmAct=null;toast("已結單，店家收到了");await load();return}
  }catch(e){busy=false;confirmAct=null;toast(errText(e));await load()}
});
document.addEventListener("input",ev=>{if(ev.target.id==="fname")form.name=ev.target.value});
document.addEventListener("change",async ev=>{const c=ev.target.closest("[data-paid]");if(!c)return;
  try{await run("pubPaid",BOOT.token,BOOT.key,c.dataset.paid,c.checked);const e=D.entries.find(x=>x.id===c.dataset.paid);if(e)e.paid=c.checked;render()}catch(e){c.checked=!c.checked;toast(errText(e))}});
load();
setInterval(()=>{if(!document.hidden&&!busy&&!form.id&&!qn(form.q)&&!document.activeElement?.matches?.("textarea,input"))load()},20000);
</script>
</body>
</html>
